name: Quality

on:
  push:
  pull_request:

jobs:
  native-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.0"
          modules: qtquick3d qtmultimedia qtwebsockets
      - name: Configure
        run: cmake -S client-side -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel

  localization-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify localization coverage
        run: python3 tools/check_localizations.py